name: CI

# On demand only: every push mailed a failing matrix to the maintainer.
on:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5' ]

    # The suite runs against a real database: what this library does is
    # about what MySQL and BerlinDB actually do.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sugarcommerce_rest_tests
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DB_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli
          coverage: none
          tools: composer:v2

      # The SugarCommerce packages it builds on are path repositories, next
      # to this one.
      - name: Sibling packages
        run: for p in data dates security; do git clone --depth 1 "https://github.com/sugarcommerce/$p.git" "../$p"; done

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: WordPress
        run: |
          mkdir -p /tmp/wordpress
          curl -sL https://wordpress.org/latest.tar.gz | tar xz --strip-components=1 -C /tmp/wordpress

      - name: Lint
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Coding standards
        run: composer lint

      - name: Formatting
        run: composer format:check

      - name: Tests
        # set -o pipefail, because a pipeline reports its last command and tee
        # always succeeds -- without it a failing suite exits 0 and reads green.
        run: |
          set -o pipefail
          composer test | tee phpunit.log
          grep -qE 'OK \(|Tests: ' phpunit.log || {
            echo '::error::phpunit produced no result -- the suite did not run'
            exit 1
          }
